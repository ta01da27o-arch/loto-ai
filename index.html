/* CSV保存 */

function exportCSV(){

    if(draws.length===0){

        alert("保存データがありません。");

        return;

    }

    let csv="game,round,date,numbers\n";

    draws.forEach(draw=>{

        csv +=
        draw.game + "," +
        draw.round + "," +
        draw.date + "," +
        draw.numbers.join("-") +
        "\n";

    });

    const blob =
    new Blob([csv],{
        type:"text/csv"
    });

    const url =
    URL.createObjectURL(blob);

    const a =
    document.createElement("a");

    a.href=url;

    a.download="loto_data.csv";

    a.click();

    URL.revokeObjectURL(url);

}

/* CSV読込 */

function importCSV(file){

    const reader =
    new FileReader();

    reader.onload=function(e){

        const text =
        e.target.result;

        const lines =
        text.trim().split("\n");

        draws=[];

        for(let i=1;i<lines.length;i++){

            const row=
            lines[i].split(",");

            if(row.length<4) continue;

            draws.push({

                game:row[0],

                round:row[1],

                date:row[2],

                numbers:
                row[3]
                .split("-")
                .map(Number)

            });

        }

        saveLocal();

        updateDataStatus();

        result.textContent=
        "CSV読込完了\n\n"+
        "保存件数："+draws.length+"件";

    };

    reader.readAsText(file);

}

function analyzeFrequency(){

    const max =
    game==="loto6"
    ?43
    :37;

    const count =
    new Array(max+1).fill(0);

    draws.forEach(draw=>{

        if(draw.game!==game){

            return;

        }

        draw.numbers.forEach(num=>{

            if(
                num>=1 &&
                num<=max
            ){

                count[num]++;

            }

        });

    });

    let text="";

    text+=
    game==="loto6"
    ?"【ロト6】\n\n"
    :"【ロト7】\n\n";

    text+="出現回数分析\n\n";

    for(let i=1;i<=max;i++){

        text+=

        i+" ： "+count[i]+"回\n";

    }

    result.textContent=text;

}

/* ==========================
Part3-2
未出現分析
Version 3.0
========================== */

function analyzeMissing(){

    const max =
    game==="loto6"
    ?43
    :37;

    const targetDraws =
    draws.filter(
        d=>d.game===game
    );

    if(targetDraws.length===0){

        result.textContent=
        "保存データがありません。";

        return;

    }

    const lastSeen =
    new Array(max+1).fill(-1);

    targetDraws.forEach((draw,index)=>{

        draw.numbers.forEach(num=>{

            if(
                num>=1 &&
                num<=max
            ){

                lastSeen[num]=index;

            }

        });

    });

    const latest =
    targetDraws.length-1;

    let text="";

    text+=
    game==="loto6"
    ?"【ロト6】\n\n"
    :"【ロト7】\n\n";

    text+="未出現分析\n\n";

    for(let i=1;i<=max;i++){

        let miss;

        if(lastSeen[i]===-1){

            miss=
            targetDraws.length;

        }else{

            miss=
            latest-lastSeen[i];

        }

        text+=
        i+" ： "+
        miss+
        "回未出現\n";

    }

    result.textContent=text;

}

/* ==========================
Part3-3
奇数・偶数分析
Version 3.0
========================== */

function analyzeOddEven(){

    const targetDraws =
    draws.filter(
        d=>d.game===game
    );

    if(targetDraws.length===0){

        result.textContent=
        "保存データがありません。";

        return;

    }

    const patternCount={};

    targetDraws.forEach(draw=>{

        let odd=0;
        let even=0;

        draw.numbers.forEach(num=>{

            if(num%2===0){

                even++;

            }else{

                odd++;

            }

        });

        const key=
        odd+"奇-"+even+"偶";

        if(!patternCount[key]){

            patternCount[key]=0;

        }

        patternCount[key]++;

    });

    let text="";

    text+=
    game==="loto6"
    ?"【ロト6】\n\n"
    :"【ロト7】\n\n";

    text+="奇数・偶数分析\n\n";

    Object.keys(patternCount)
    .sort()
    .forEach(key=>{

        text+=
        key+
        " ： "+
        patternCount[key]+
        "回\n";

    });

    result.textContent=text;

}

        "保存データがありません。";

    const border =
    game==="loto6"
    ?21
    :18;

    const patternCount={};

    targetDraws.forEach(draw=>{

        let low=0;
        let high=0;

        draw.numbers.forEach(num=>{

            if(num<=border){

            }else{

        const key=

        if(!patternCount[key]){

            patternCount[key]=0;

        }

    });

        "回\n";

    });

    result.textContent=text;

}

function analyzeSequence(){

    targetDraws.forEach(draw=>{

        .sort((a,b)=>a-b);

        let found=false;

        for(

            let i=0;

            i<nums.length-1;

            i++

                nums[i]+1===nums[i+1]

            ){

                totalPair++;

                found=true;

            hitDraw++;

        }

    });

    const rate=

    (

        hitDraw/

        targetDraws.length*

        100

    ).toFixed(1);

    text+="出現率："+rate+"％";

    result.textContent=text;

}

function analyzeCarryOver(){

    const targetDraws=
    draws.filter(
        d=>d.game===game
    );

    if(targetDraws.length<2){

        result.textContent=
        "2回以上の抽選データが必要です。";

        return;

    }

    const lastDraw=
    targetDraws[targetDraws.length-1];

    const prevDraw=
    targetDraws[targetDraws.length-2];

    /* 今回の引っ張り数字 */

    const carry=[];

    lastDraw.numbers.forEach(num=>{

        if(prevDraw.numbers.includes(num)){

            carry.push(num);

        }

    });

    /* 過去全体の引っ張り率 */

    let totalCarry=0;

    let totalCompare=0;

    for(

        let i=1;

        i<targetDraws.length;

        i++

    ){

        const before=

        targetDraws[i-1];

        const current=

        targetDraws[i];

        current.numbers.forEach(num=>{

            totalCompare++;

            if(

                before.numbers.includes(num)

            ){

                totalCarry++;

            }

        });

    }

    const rate=

    totalCompare===0

    ?0

    :(

        totalCarry/

        totalCompare*

        100

    ).toFixed(1);

    let text="";

    text+="【引っ張り数字分析】\n\n";

    text+="前回抽選\n";

    text+="第"+prevDraw.round+"回\n";

    text+="抽選日："+(prevDraw.date||"-")+"\n";

    text+=prevDraw.numbers.join(" ");

    text+="\n\n";

    text+="最新抽選\n";

    text+="第"+lastDraw.round+"回\n";

    text+="抽選日："+(lastDraw.date||"-")+"\n";

    text+=lastDraw.numbers.join(" ");

    text+="\n\n";

    if(carry.length===0){

        text+="引っ張り数字：なし\n";

    }else{

        text+="引っ張り数字\n";

        text+=carry.join(" ");

        text+="\n";

    }

    text+="\n";

    text+="今回："+carry.length+"個\n";

    text+="過去累計："+totalCarry+"個\n";

    text+="比較総数："+totalCompare+"個\n";

    text+="引っ張り率："+rate+"％";

    result.textContent=text;

}
